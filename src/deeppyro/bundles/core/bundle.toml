[bundle]
id = "core"
name = "DeepPyro core"
version = "0.1.0"
order = 0
critical = true

# The kernel provides the config service itself. Every capability below is a
# plugin row: user bundles can override config, disable a row, or insert their
# own rows before or after any id here.

# The kernel runtime service must mount first: it reports mounted plugin states
# (kernel.mounted_plugins) and applies volatile config patches
# (kernel.apply_plugin_config), both used by the plugin manager, settings and
# inspect rows that follow.
[[plugins]]
id = "kernel"
plugin = "deeppyro.kernel.runtime:KernelRuntime"

[[plugins]]
id = "llm"
plugin = "deeppyro.builtin.llm:LlmPlugin"

[[plugins]]
id = "sessions"
plugin = "deeppyro.builtin.sessions:SessionsPlugin"

[[plugins]]
id = "session-query"
plugin = "deeppyro.builtin.session_query:SessionQueryPlugin"

[[plugins]]
id = "sandbox"
plugin = "deeppyro.builtin.sandbox:SandboxPlugin"

[[plugins]]
id = "tools"
plugin = "deeppyro.builtin.tools:ToolsPlugin"

[[plugins]]
id = "tools-builtin"
plugin = "deeppyro.builtin.tools:BuiltinToolsPlugin"

[[plugins]]
id = "compress"
plugin = "deeppyro.builtin.compress:CompressPlugin"

[[plugins]]
id = "schedule"
plugin = "deeppyro.builtin.schedule:SchedulePlugin"
critical = false

[[plugins]]
id = "working-directory"
plugin = "deeppyro.builtin.working_directory:WorkingDirectoryPlugin"

[[plugins]]
id = "user-questions"
plugin = "deeppyro.builtin.user_questions:UserQuestionsPlugin"

[[plugins]]
id = "attachments"
plugin = "deeppyro.builtin.attachments:AttachmentsPlugin"

[[plugins]]
id = "hooks"
plugin = "deeppyro.builtin.hooks:HooksPlugin"

[[plugins]]
id = "jobs"
plugin = "deeppyro.builtin.jobs:JobsPlugin"

[[plugins]]
id = "plugin-tools"
plugin = "deeppyro.tools.builtin.plugin_tools:PluginToolsPlugin"

[[plugins]]
id = "presets"
plugin = "deeppyro.builtin.presets:PresetsPlugin"

[[plugins]]
id = "prompt"
plugin = "deeppyro.builtin.prompt_service:PromptPlugin"

[[plugins]]
id = "prompt-core"
plugin = "deeppyro.builtin.prompt_core:PromptCorePlugin"

# PTC registers prompt sections in ptc mode, so it must mount after prompt-core.
[[plugins]]
id = "ptc"
plugin = "deeppyro.builtin.ptc:PtcPlugin"
critical = false

[[plugins]]
id = "memory"
plugin = "deeppyro.builtin.memory:MemoryPlugin"
critical = false

[[plugins]]
id = "skills"
plugin = "deeppyro.builtin.skills:SkillsPlugin"
critical = false

[[plugins]]
id = "commands"
plugin = "deeppyro.builtin.commands:CommandsPlugin"

[[plugins]]
id = "commands-builtin"
plugin = "deeppyro.builtin.commands_builtin:CommandsBuiltinPlugin"

[[plugins]]
id = "agents"
plugin = "deeppyro.builtin.agents:AgentsPlugin"

[[plugins]]
id = "team"
plugin = "deeppyro.builtin.team:TeamPlugin"

[[plugins]]
id = "subagent"
plugin = "deeppyro.builtin.subagent:SubagentPlugin"

[[plugins]]
id = "activity"
plugin = "deeppyro.builtin.activity:ActivityPlugin"

[[plugins]]
id = "projections"
plugin = "deeppyro.builtin.projections:ProjectionsPlugin"

[[plugins]]
id = "slots"
plugin = "deeppyro.tui.slots:SlotsPlugin"

[[plugins]]
id = "plugin-manager"
plugin = "deeppyro.builtin.plugin_manager:PluginManagerPlugin"

[[plugins]]
id = "settings"
plugin = "deeppyro.builtin.settings:SettingsPlugin"

[[plugins]]
id = "inspect"
plugin = "deeppyro.builtin.inspect:InspectPlugin"