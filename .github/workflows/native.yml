name: native-replay

# M4/M5 offline track: replay the recorded native fixtures, score the 20 golden
# evals, and run the native synthetic coverage matrix (KI-011). The job is a real
# gate: it never contacts a provider and depends only on checked-in fixtures, so
# fixture drift and coverage gaps must fail the PR here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline replay + golden eval + native coverage matrix
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: replay recorded native fixtures and score golden evals
        run: uv run python scripts/record_replay.py --json native-replay-report.json
      - name: print native synthetic coverage matrix
        run: uv run python scripts/differential_matrix.py --json native-differential-matrix.json
      - name: eval, replay and native capability tests
        run: uv run python -m pytest tests/eval tests/native
      - name: upload offline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-replay-report-${{ matrix.python-version }}
          path: |
            native-replay-report.json
            native-differential-matrix.json
          if-no-files-found: warn
