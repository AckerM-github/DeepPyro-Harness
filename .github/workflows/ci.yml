name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The harness ships for Windows first (ACL sandbox, PowerShell shell tool,
    # TUI); the tests that cannot run elsewhere skip themselves on other hosts.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: pyright ratchet
        run: uv run python scripts/typecheck.py
      - name: pytest
        run: uv run pytest
