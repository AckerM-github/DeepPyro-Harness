[project]
name = "deeppyro-harness"
version = "0.2.0"
description = "DeepPyro Harness — terminal-first pure Python agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "rich>=13.9",
  "zstandard>=0.23",
  "typing-extensions>=4.12",
  "textual>=8.2,<9",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
  "pillow>=11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.17",
  "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dpyro = "deeppyro.tui.main:main"
deeppyro = "deeppyro.tui.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deeppyro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Ratchet: the rule families that catch the failure modes this port is prone to.
# Add a rule only together with the fixes it demands, never with a blanket ignore.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "N",   # pep8-naming
  "UP",  # pyupgrade: modern syntax for the declared target version
  "B",   # bugbear: real bugs, not style
  "SIM", # simplify: dead branches, redundant control flow
  "RUF", # ruff-native checks
  "BLE", # blind-except: a broad except must say why in a noqa comment
  "ANN", # annotations: signatures explain themselves without the body
]
ignore = [
  # The source tree is bilingual; Chinese punctuation and dashes are intentional.
  "RUF001",
  "RUF002",
  "RUF003",
  # The formatter owns line width: long URLs, error strings and Chinese prose
  # cannot be wrapped, and ruff format already reflows everything it can.
  "E501",
  # Domain exceptions read better without the suffix: PermissionDenied,
  # UnknownPlugin, InstallFailure, SettingsConflict. The Error suffix stays
  # reserved for the core hierarchy in deeppyro.core.errors.
  "N818",
  # Require annotations, but allow Any at the dynamic boundaries: the plugin
  # context facade, hook payloads and the service lookups that accept either a
  # name or a contract class are deliberately untyped. Removing those Any is
  # separate typing work.
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# camelCase here mirrors the DSH wire format written to session.v4.jsonl and the
# on-disk TOML config schema. Python-side attributes move to snake_case with a
# pydantic alias generator; the wire names must not change. Tracked as P1-5.
"src/deeppyro/core/wire.py" = ["N815"]
"src/deeppyro/config.py" = ["N815"]
"src/deeppyro/attachments/types.py" = ["N815"]
"src/deeppyro/session/store.py" = ["N815"]
"src/deeppyro/session_query/types.py" = ["N815"]
"src/deeppyro/builtin/compress.py" = ["N815"]
"src/deeppyro/builtin/session_title.py" = ["N815"]
"src/deeppyro/builtin/session_query.py" = ["N815"]
# ctypes structs must keep the Win32 spelling to stay greppable against the SDK.
"src/deeppyro/sandbox/windows_acl_runner.py" = ["N801"]
# Fixtures replay real payloads, so they keep the wire casing too.
"tests/agent/test_images.py" = ["N815"]
"tests/builtin/demo_plugins.py" = ["N815"]
# Test bodies are fixtures, not public contracts: annotating every fake kernel,
# stub tool and async test helper would add noise without catching bugs.
"tests/**" = ["ANN"]
# Tool schemas are class-level constants that are replaced at import and never
# mutated in place, so RUF012's shared-default warning does not apply. They
# must stay instance attributes rather than ClassVars: the MCP and PTC adapters
# build a schema per instance (see BaseTool.__init_subclass__).
"src/deeppyro/tools/base.py" = ["RUF012"]
"src/deeppyro/tools/builtin/goal.py" = ["RUF012"]
"src/deeppyro/tools/builtin/ask_user.py" = ["RUF012"]
"src/deeppyro/ptc/tool.py" = ["RUF012"]

[tool.ruff.format]
# Spec docs are prose; format only Python sources.
exclude = ["docs/**"]
